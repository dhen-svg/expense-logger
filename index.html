<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Expense Logger</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #ffffff);
    --text: var(--tg-theme-text-color, #111111);
    --hint: var(--tg-theme-hint-color, #888888);
    --button: var(--tg-theme-button-color, #2ea6ff);
    --button-text: var(--tg-theme-button-text-color, #ffffff);
    --secondary-bg: var(--tg-theme-secondary-bg-color, #f2f2f2);
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0; padding: 16px 16px 32px;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  h1 { font-size: 20px; margin: 4px 0 12px; }
  label { display: block; font-size: 13px; color: var(--hint); margin: 14px 0 6px; }
  .row { display: flex; gap: 10px; }
  .row > div { flex: 1; min-width: 0; }
  input[type="date"], input[type="time"] { min-width: 0; }
  input, select {
    width: 100%; min-height: 44px; padding: 10px 12px; font-size: 16px;
    border: 1px solid var(--secondary-bg); border-radius: 10px;
    background: var(--secondary-bg); color: var(--text);
  }
  button {
    width: 100%; margin-top: 24px; padding: 14px; min-height: 44px;
    background: var(--button); color: var(--button-text);
    border: none; border-radius: 12px; font-size: 16px; font-weight: 600;
  }
  button:disabled { opacity: 0.5; }
  .seg { display: flex; background: var(--secondary-bg); border-radius: 12px; padding: 3px; margin: 0 0 6px; }
  .seg button { margin: 0; flex: 1; width: auto; background: transparent; color: var(--text); border-radius: 10px; }
  .seg button[aria-pressed="true"] { background: var(--button); color: var(--button-text); }
  .hint { font-size: 13px; color: var(--hint); margin: 8px 0 0; }
  h2 { font-size: 15px; margin: 22px 0 8px; }
  .monthnav { display: flex; align-items: center; gap: 8px; margin: 8px 0 4px; }
  .monthnav button { margin: 0; width: 48px; flex: none; font-size: 22px; padding: 0; }
  .monthlabel { flex: 1; text-align: center; font-size: 16px; font-weight: 600; }
  .dmsg { font-size: 14px; color: var(--hint); text-align: center; min-height: 20px; margin: 10px 0; }
  .dmsg.error { color: #d32f2f; }
  .dmsg button { margin-top: 12px; width: auto; padding: 10px 18px; }
  .cards { display: grid; gap: 8px; }
  .card { background: var(--secondary-bg); border-radius: 12px; padding: 12px 14px; }
  .card .k { font-size: 13px; color: var(--hint); }
  .card .v { font-size: 20px; font-weight: 700; margin: 2px 0; font-variant-numeric: tabular-nums; }
  .card .s { font-size: 13px; color: var(--hint); }
  .track { height: 8px; border-radius: 4px; background: var(--bg); position: relative; margin: 6px 0 4px; overflow: hidden; }
  .track i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 4px; }
  .track .plan { background: var(--hint); opacity: 0.35; }
  .track .act { background: var(--button); }
  .track .act.over { background: #d97706; }
  details.cat { border-bottom: 1px solid var(--secondary-bg); }
  details.cat > summary { list-style: none; cursor: pointer; padding: 10px 0; min-height: 44px; }
  details.cat > summary::-webkit-details-marker { display: none; }
  .crow { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
  .crow b { font-size: 15px; }
  .crow span { font-size: 13px; color: var(--hint); font-variant-numeric: tabular-nums; text-align: right; }
  .sub { padding: 6px 0 10px 14px; }
  .sub .crow b { font-size: 14px; font-weight: 500; }
  .dev { font-size: 13px; font-variant-numeric: tabular-nums; }
  .dev.over { color: #d97706; }
  .dev.under { color: var(--hint); }
  .trow { display: flex; justify-content: space-between; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--secondary-bg); min-height: 44px; align-items: center; }
  .trow .dev { white-space: nowrap; }
  .trow .n { font-size: 14px; }
  .trow .n small { display: block; color: var(--hint); font-size: 12px; }
  .acc { padding: 8px 0; border-bottom: 1px solid var(--secondary-bg); font-size: 14px; }
  .acc small { display: block; color: var(--hint); font-size: 13px; font-variant-numeric: tabular-nums; }
  svg.chart { width: 100%; height: auto; display: block; }
  .legend { display: flex; gap: 14px; font-size: 12px; color: var(--hint); margin-top: 4px; }
  #status { margin-top: 14px; font-size: 14px; text-align: center; min-height: 20px; }
  #status.error { color: #d32f2f; }
  #status.success { color: #2e7d32; }
</style>
</head>
<body>
  <h1 id="title">New Transaction</h1>

  <div class="seg" id="mode-switch" role="group" aria-label="View">
    <button type="button" id="mode-txn" aria-pressed="true">Log</button>
    <button type="button" id="mode-transfer" aria-pressed="false" hidden>Transfer</button>
    <button type="button" id="mode-dash" aria-pressed="false">Dashboard</button>
  </div>

  <div class="row" id="row-when">
    <div>
      <label for="date">Date</label>
      <input type="date" id="date" />
    </div>
    <div>
      <label for="time">Time</label>
      <input type="time" id="time" />
    </div>
  </div>

  <div id="form-txn">
    <label for="category">Category</label>
    <select id="category"></select>

    <label for="subcategory">Subcategory</label>
    <select id="subcategory"></select>

    <label for="amount">Amount (IDR)</label>
    <input type="number" id="amount" min="0" step="1" placeholder="0" />

    <label for="account">Payment Account</label>
    <select id="account"></select>

    <label>Used By</label>
    <div id="used_by" style="display:flex; flex-wrap:wrap; gap:8px;"></div>

    <label for="tags">Tags</label>
    <input type="text" id="tags" placeholder="comma separated, e.g. weekend, urgent" list="tag-options" />
    <datalist id="tag-options"></datalist>

    <label for="description">Description</label>
    <input type="text" id="description" placeholder="Optional" />
  </div>

  <div id="form-transfer" hidden>
    <label for="from_account">From account</label>
    <select id="from_account"></select>

    <label for="to_account">To account</label>
    <select id="to_account"></select>

    <label for="amount_out" id="label_out">Amount sent</label>
    <input type="number" id="amount_out" min="0" step="any" placeholder="0" />

    <div id="in_wrap" hidden>
      <label for="amount_in" id="label_in">Amount received</label>
      <input type="number" id="amount_in" min="0" step="any" placeholder="0" />
    </div>

    <label for="fee" id="label_fee">Fee (optional)</label>
    <input type="number" id="fee" min="0" step="any" placeholder="0" />
    <p class="hint" id="fee_hint"></p>

    <label for="t_description">Description</label>
    <input type="text" id="t_description" placeholder="Optional" />
  </div>

  <div id="view-dash" hidden>
    <div class="monthnav">
      <button type="button" id="dash-prev" aria-label="Previous month">&lsaquo;</button>
      <div id="dash-month" class="monthlabel" aria-live="polite"></div>
      <button type="button" id="dash-next" aria-label="Next month">&rsaquo;</button>
    </div>
    <div id="dash-msg" class="dmsg" role="status"></div>
    <div id="dash-body" hidden>
      <div class="cards" id="dash-cards"></div>
      <h2>Plan against actual, by category</h2>
      <p class="hint" id="dash-cat-hint">Tap a category to see its subcategories.</p>
      <div id="dash-cats"></div>
      <h2>Biggest deviations</h2>
      <div id="dash-top"></div>
      <h2>Year to date</h2>
      <div id="dash-ytd"></div>
      <h2>Money in and out, by account</h2>
      <div id="dash-acc"></div>
      <p class="hint">Deviations from the plan are normal. They show what to learn, not what to fix. Income has no plan in the database yet.</p>
    </div>
  </div>

  <button id="save">Save</button>
  <div id="status" role="status"></div>

<script>
const tg = window.Telegram?.WebApp;
tg?.ready();
tg?.expand();

const initData = tg?.initData || "";
const startParam = tg?.initDataUnsafe?.start_param || "";
let categories = [], subcategories = [], accounts = [], spenders = [], knownTags = [];
let transfersEnabled = false;
let mode = "txn";

const el = (id) => document.getElementById(id);
const statusEl = el("status");

function setStatus(msg, kind) {
  statusEl.textContent = msg;
  statusEl.className = kind || "";
}

function todayISO() {
  const d = new Date();
  const tz = d.getTimezoneOffset() * 60000;
  return new Date(d - tz).toISOString().slice(0, 10);
}

function nowHHMM() {
  const d = new Date();
  return d.toTimeString().slice(0, 5);
}

function fmtMoney(n, cur) {
  if (!cur || cur === "IDR") return "Rp " + Number(n).toLocaleString("id-ID");
  return cur + " " + Number(n).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function populateSelect(select, items, placeholder) {
  select.innerHTML = "";
  if (placeholder) {
    const opt = document.createElement("option");
    opt.value = ""; opt.textContent = placeholder; opt.disabled = true; opt.selected = true;
    select.appendChild(opt);
  }
  for (const item of items) {
    const opt = document.createElement("option");
    opt.value = item.id; opt.textContent = item.name;
    select.appendChild(opt);
  }
}

function populateCategorySelect() {
  const select = el("category");
  select.innerHTML = "";
  for (const type of ["income", "expense"]) {
    const group = document.createElement("optgroup");
    group.label = type === "income" ? "Income" : "Expense";
    for (const c of categories.filter((c) => c.type === type)) {
      const opt = document.createElement("option");
      opt.value = c.id; opt.textContent = c.name;
      group.appendChild(opt);
    }
    if (group.children.length) select.appendChild(group);
  }
}

function populateUsedByCheckboxes(spenders) {
  const container = el("used_by");
  container.innerHTML = "";
  for (const s of spenders) {
    const wrap = document.createElement("label");
    wrap.style.cssText = "display:flex; align-items:center; gap:4px; width:auto; margin:0; padding:6px 10px; min-height:44px; background:var(--secondary-bg); border-radius:22px; font-size:14px; color:var(--text);";
    const cb = document.createElement("input");
    cb.type = "checkbox"; cb.value = s.id; cb.style.cssText = "width:auto; min-height:0;";
    wrap.appendChild(cb);
    wrap.appendChild(document.createTextNode(s.name));
    container.appendChild(wrap);
  }
}

function getUsedByIds() {
  return [...el("used_by").querySelectorAll("input[type=checkbox]:checked")].map((cb) => Number(cb.value));
}

function refreshSubcategoryOptions() {
  const catId = Number(el("category").value);
  const filtered = subcategories.filter((s) => s.category_id === catId);
  populateSelect(el("subcategory"), filtered, filtered.length ? null : "No subcategories");
}

// ---- Transfer form helpers ----
const accById = (id) => accounts.find((a) => a.id === Number(id));
const curOf = (a) => (a && a.currency) || "IDR";

function populateTransferSelects() {
  const items = accounts.map((a) => ({ id: a.id, name: curOf(a) === "IDR" ? a.name : `${a.name} (${curOf(a)})` }));
  populateSelect(el("from_account"), items, "Choose account");
  populateSelect(el("to_account"), items, "Choose account");
}

function refreshTransferLabels() {
  const from = accById(el("from_account").value);
  const to = accById(el("to_account").value);
  const fromCur = from ? curOf(from) : "IDR";
  const toCur = to ? curOf(to) : fromCur;
  el("label_out").textContent = `Amount sent (${fromCur})`;
  el("label_fee").textContent = `Fee, optional (${fromCur})`;
  const cross = from && to && fromCur !== toCur;
  el("in_wrap").hidden = !cross;
  el("label_in").textContent = `Amount received (${toCur})`;
  el("fee_hint").textContent = fromCur === "IDR"
    ? "A fee is also saved as a Taxes & Fees expense, so budgets and reports include it."
    : "A fee in this currency stays on the transfer only, because the expense ledger is IDR.";
}

function setMode(next) {
  mode = next;
  const dash = next === "dash";
  el("form-txn").hidden = next !== "txn";
  el("form-transfer").hidden = next !== "transfer";
  el("view-dash").hidden = !dash;
  el("row-when").hidden = dash;
  el("save").hidden = dash;
  el("status").hidden = dash;
  el("mode-txn").setAttribute("aria-pressed", String(next === "txn"));
  el("mode-transfer").setAttribute("aria-pressed", String(next === "transfer"));
  el("mode-dash").setAttribute("aria-pressed", String(dash));
  el("title").textContent = next === "txn" ? "New Transaction" : next === "transfer" ? "New Transfer" : "Dashboard";
  el("save").textContent = next === "txn" ? "Save" : "Save transfer";
  setStatus("");
  if (dash) loadDashboard();
}

async function loadOptions() {
  if (!initData) {
    setStatus("Open this from the Telegram bot menu, not a browser.", "error");
    el("save").disabled = true;
    return;
  }
  try {
    const res = await fetch("/api/options", {
      headers: { "X-Telegram-Init-Data": initData },
    });
    if (!res.ok) throw new Error("options request failed: " + res.status);
    const data = await res.json();
    categories = data.categories; subcategories = data.subcategories;
    accounts = data.accounts; spenders = data.spenders; knownTags = data.tags || [];
    transfersEnabled = !!data.transfers_enabled;

    populateCategorySelect();
    refreshSubcategoryOptions();
    // The expense form lists only accounts used for daily spending.
    populateSelect(el("account"), accounts.filter((a) => a.show_in_expense_form !== false));
    populateTransferSelects();
    refreshTransferLabels();
    populateUsedByCheckboxes(spenders);

    const dl = el("tag-options");
    dl.innerHTML = "";
    for (const t of knownTags) {
      const opt = document.createElement("option");
      opt.value = t;
      dl.appendChild(opt);
    }

    el("date").value = todayISO();
    el("time").value = nowHHMM();

    el("mode-transfer").hidden = !transfersEnabled;
    setMode(startParam === "dashboard" ? "dash" : transfersEnabled && startParam === "transfer" ? "transfer" : "txn");
  } catch (err) {
    setStatus("Could not load categories. Pull down to retry.", "error");
  }
}

el("category").addEventListener("change", refreshSubcategoryOptions);
el("from_account").addEventListener("change", refreshTransferLabels);
el("to_account").addEventListener("change", refreshTransferLabels);
el("mode-txn").addEventListener("click", () => setMode("txn"));
el("mode-transfer").addEventListener("click", () => setMode("transfer"));
el("mode-dash").addEventListener("click", () => setMode("dash"));

async function post(url, payload) {
  const res = await fetch(url, {
    method: "POST",
    headers: { "Content-Type": "application/json", "X-Telegram-Init-Data": initData },
    body: JSON.stringify(payload),
  });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || "save failed");
  return data;
}

async function saveTransfer() {
  const from = accById(el("from_account").value);
  const to = accById(el("to_account").value);
  const cross = from && to && curOf(from) !== curOf(to);
  const payload = {
    transfer_date: el("date").value,
    transfer_time: el("time").value,
    from_account_id: el("from_account").value,
    to_account_id: el("to_account").value,
    amount_out: el("amount_out").value,
    fee_amount: el("fee").value || 0,
    description: el("t_description").value,
  };
  if (cross) payload.amount_in = el("amount_in").value;

  if (!payload.transfer_date || !from || !to || !(Number(payload.amount_out) > 0)) {
    setStatus("Fill in date, both accounts and the amount.", "error");
    return;
  }
  if (from.id === to.id) { setStatus("Choose two different accounts.", "error"); return; }
  if (cross && !(Number(payload.amount_in) > 0)) {
    setStatus(`Enter the amount received in ${curOf(to)}.`, "error");
    return;
  }

  el("save").disabled = true;
  setStatus("Saving…");
  try {
    const data = await post("/api/transfers", payload);
    const no = data.transfer?.txn_no || "";
    setStatus(`✓ Transfer ${no}: ${fmtMoney(payload.amount_out, curOf(from))} · ${from.name} → ${to.name}`, "success");
    tg?.HapticFeedback?.notificationOccurred("success");
    el("amount_out").value = ""; el("amount_in").value = ""; el("fee").value = ""; el("t_description").value = "";
  } catch (err) {
    setStatus("Save failed: " + err.message, "error");
    tg?.HapticFeedback?.notificationOccurred("error");
  } finally {
    el("save").disabled = false;
  }
}

el("save").addEventListener("click", async () => {
  if (mode === "transfer") return saveTransfer();

  const tagList = el("tags").value.split(",").map((t) => t.trim()).filter(Boolean);

  const payload = {
    expense_date: el("date").value,
    expense_time: el("time").value,
    category_id: el("category").value,
    subcategory_id: el("subcategory").value,
    account_id: el("account").value,
    used_by_ids: getUsedByIds(),
    amount: el("amount").value,
    description: el("description").value,
    tags: tagList,
  };

  if (!payload.expense_date || !payload.category_id || !payload.subcategory_id ||
      !payload.account_id || !payload.amount || Number(payload.amount) <= 0) {
    setStatus("Fill in date, category, subcategory, amount, and account.", "error");
    return;
  }

  el("save").disabled = true;
  setStatus("Saving…");

  try {
    await post("/api/expenses", payload);

    const catName = categories.find((c) => c.id === Number(payload.category_id))?.name || "";
    const subName = subcategories.find((s) => s.id === Number(payload.subcategory_id))?.name || "";
    setStatus(`✓ Saved: Rp ${Number(payload.amount).toLocaleString("id-ID")} · ${catName} / ${subName}`, "success");
    tg?.HapticFeedback?.notificationOccurred("success");

    el("amount").value = "";
    el("description").value = "";
    el("tags").value = "";
  } catch (err) {
    setStatus("Save failed: " + err.message, "error");
    tg?.HapticFeedback?.notificationOccurred("error");
  } finally {
    el("save").disabled = false;
  }
});


// ---------------- Dashboard ----------------
const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
let dashYear = new Date().getFullYear(), dashMonth = new Date().getMonth() + 1, dashSeq = 0;
const rp = (n) => (n < 0 ? "-" : "") + "Rp " + Math.round(Math.abs(n)).toLocaleString("id-ID");
const fmtNat = (n, cur) => (cur === "IDR" ? rp(n) : cur + " " + Math.abs(n).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 }));
function mk(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; }
function devText(plan, actual) {
  const v = actual - plan;
  if (plan === 0 && actual === 0) return { t: "No plan, no spend", c: "under" };
  if (plan === 0) return { t: "Unplanned: " + rp(actual), c: "over" };
  const pct = Math.round((v / plan) * 100);
  if (v > 0) return { t: "Over by " + rp(v) + " (+" + pct + "%)", c: "over" };
  if (v < 0) return { t: "Under by " + rp(-v) + " (" + pct + "%)", c: "under" };
  return { t: "On plan", c: "under" };
}
function bar(plan, actual) {
  const max = Math.max(plan, actual, 1);
  const t = mk("div", "track"); t.setAttribute("aria-hidden", "true");
  const p = mk("i", "plan"); p.style.width = (plan / max * 100) + "%";
  const a = mk("i", "act" + (actual > plan ? " over" : "")); a.style.width = (actual / max * 100) + "%";
  t.append(p, a); return t;
}
function setDashMsg(text, kind, retry) {
  const m = el("dash-msg"); m.textContent = text; m.className = "dmsg" + (kind ? " " + kind : "");
  if (retry) { const b = mk("button", "", "Try again"); b.type = "button"; b.addEventListener("click", loadDashboard); m.appendChild(document.createElement("br")); m.appendChild(b); }
}
function ytdChart(rows) {
  const W = 340, H = 170, L = 8, R = 8, T = 10, B = 24, pw = W - L - R, ph = H - T - B;
  const max = Math.max(...rows.map((r) => Math.max(r.plan, r.actual || 0)), 1);
  const x = (i) => L + (i / 11) * pw, y = (v) => T + ph - (v / max) * ph;
  const NS = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(NS, "svg"); svg.setAttribute("viewBox", `0 0 ${W} ${H}`); svg.setAttribute("class", "chart"); svg.setAttribute("role", "img");
  const last = rows.filter((r) => r.actual !== null).at(-1);
  svg.setAttribute("aria-label", `Cumulative spending this year: plan ${rp(rows[11].plan)} for the full year, actual ${rp(last ? last.actual : 0)} so far`);
  const mkSvg = (tag, attrs) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); return e; };
  svg.appendChild(mkSvg("line", { x1: L, x2: W - R, y1: T + ph, y2: T + ph, stroke: "var(--hint)", "stroke-opacity": "0.4" }));
  const path = (pts, attrs) => mkSvg("path", Object.assign({ d: pts.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join(""), fill: "none", "stroke-width": "2", "stroke-linejoin": "round" }, attrs));
  svg.appendChild(path(rows.map((r, i) => [x(i), y(r.plan)]), { stroke: "var(--hint)", "stroke-dasharray": "5 4" }));
  const act = rows.map((r, i) => (r.actual === null ? null : [x(i), y(r.actual)])).filter(Boolean);
  if (act.length) {
    svg.appendChild(path(act, { stroke: "var(--button)" }));
    svg.appendChild(mkSvg("circle", { cx: act.at(-1)[0], cy: act.at(-1)[1], r: "4", fill: "var(--button)" }));
  }
  [0, 2, 5, 8, 11].forEach((i) => { const t = mkSvg("text", { x: x(i), y: H - 6, "text-anchor": i === 0 ? "start" : i === 11 ? "end" : "middle", "font-size": "11", fill: "var(--hint)" }); t.textContent = MONTHS[i]; svg.appendChild(t); });
  return svg;
}
function renderDashboard(d) {
  el("dash-month").textContent = MONTHS[d.month - 1] + " " + d.year;
  const t = d.totals, cards = el("dash-cards"); cards.replaceChildren();
  const pct = t.expense_plan ? Math.round((t.expense_actual / t.expense_plan) * 100) : null;
  const c1 = mk("div", "card"); c1.append(mk("div", "k", "Spent against plan"), mk("div", "v", rp(t.expense_actual)),
    mk("div", "s", "Plan " + rp(t.expense_plan) + (pct === null ? "" : " · " + pct + "% used")), bar(t.expense_plan, t.expense_actual),
    mk("div", "dev " + devText(t.expense_plan, t.expense_actual).c, devText(t.expense_plan, t.expense_actual).t));
  const c2 = mk("div", "card"); c2.append(mk("div", "k", "Income logged"), mk("div", "v", rp(t.income_actual)), mk("div", "s", "No plan for income yet"));
  const c3 = mk("div", "card"); c3.append(mk("div", "k", "Income minus spending"), mk("div", "v", rp(t.net_actual)), mk("div", "s", "Before transfers to investments"));
  cards.append(c1, c2, c3);

  const cats = el("dash-cats"); cats.replaceChildren();
  if (!d.categories.length) cats.appendChild(mk("p", "hint", "No plan or spending for this month."));
  for (const c of d.categories) {
    const det = mk("details", "cat"), sum = mk("summary");
    const row = mk("div", "crow"); row.append(mk("b", "", c.name), mk("span", "", rp(c.actual) + " of " + rp(c.plan)));
    const dv = devText(c.plan, c.actual);
    sum.append(row, bar(c.plan, c.actual), mk("div", "dev " + dv.c, dv.t)); det.appendChild(sum);
    for (const s of c.subs) {
      const sd = devText(s.plan, s.actual), box = mk("div", "sub"), r = mk("div", "crow");
      r.append(mk("b", "", s.name), mk("span", "", rp(s.actual) + " of " + rp(s.plan)));
      box.append(r, bar(s.plan, s.actual), mk("div", "dev " + sd.c, sd.t)); det.appendChild(box);
    }
    cats.appendChild(det);
  }

  const top = el("dash-top"); top.replaceChildren();
  if (!d.top_variances.length) top.appendChild(mk("p", "hint", "Nothing to compare yet."));
  for (const v of d.top_variances) {
    const row = mk("div", "trow"), n = mk("div", "n", v.name); n.appendChild(mk("small", "", v.category + " · plan " + rp(v.plan) + ", actual " + rp(v.actual)));
    const dv = devText(v.plan, v.actual); row.append(n, mk("div", "dev " + dv.c, (v.variance > 0 ? "+" : v.variance < 0 ? "-" : "") + rp(Math.abs(v.variance)).replace("Rp ", "Rp ")));
    top.appendChild(row);
  }

  const ytd = el("dash-ytd"); ytd.replaceChildren(); ytd.appendChild(ytdChart(d.ytd));
  const lg = mk("div", "legend"); lg.append(mk("span", "", "Dashed: plan, whole year"), mk("span", "", "Solid: actual so far")); ytd.appendChild(lg);
  const lastRow = d.ytd.filter((r) => r.actual !== null).at(-1);
  const planToDate = d.ytd[d.month - 1].plan;
  ytd.appendChild(mk("p", "hint", "To date: actual " + rp(lastRow ? lastRow.actual : 0) + " against a plan of " + rp(planToDate) + (d.meta.first_entry_date ? ". Logging started " + d.meta.first_entry_date + ", so earlier months show plan only." : ".")));

  const acc = el("dash-acc"); acc.replaceChildren();
  if (!d.accounts.length) acc.appendChild(mk("p", "hint", "No money moved in this month."));
  for (const a of d.accounts) {
    const row = mk("div", "acc", a.name);
    row.appendChild(mk("small", "", "In " + fmtNat(a.inflow, a.currency) + " · Out " + fmtNat(a.outflow, a.currency) + " · Net " + (a.net < 0 ? "-" : "") + fmtNat(a.net, a.currency)));
    acc.appendChild(row);
  }
  el("dash-body").hidden = false;
  setDashMsg(d.meta.entries_in_month === 0 ? "Nothing logged for " + MONTHS[d.month - 1] + " " + d.year + " yet. The plan is shown for reference." : "");
}
async function loadDashboard() {
  const seq = ++dashSeq;
  el("dash-month").textContent = MONTHS[dashMonth - 1] + " " + dashYear;
  el("dash-body").hidden = true; setDashMsg("Loading…");
  try {
    const res = await fetch(`/api/dashboard?year=${dashYear}&month=${dashMonth}`, { headers: { "X-Telegram-Init-Data": initData } });
    const data = await res.json();
    if (seq !== dashSeq) return;
    if (!res.ok) throw new Error(data.error || "request failed");
    renderDashboard(data);
  } catch (err) {
    if (seq !== dashSeq) return;
    setDashMsg("Could not load the dashboard: " + err.message, "error", true);
  }
}
function shiftMonth(delta) {
  dashMonth += delta;
  if (dashMonth < 1) { dashMonth = 12; dashYear--; }
  if (dashMonth > 12) { dashMonth = 1; dashYear++; }
  loadDashboard();
}
el("dash-prev").addEventListener("click", () => shiftMonth(-1));
el("dash-next").addEventListener("click", () => shiftMonth(1));

loadOptions();
</script>
</body>
</html>
